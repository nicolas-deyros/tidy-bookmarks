<!DOCTYPE html>
<html data-theme="quiet" data-appearance="system">
<head>
  <meta charset="utf-8">
  <title>Bookmark Organizer</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <header>
    <h1>Bookmark Organizer</h1>
    <input id="search" type="search" placeholder="Search by topic, title, URL, or tag…">
    <div id="view-toggle" role="tablist">
      <button id="tab-browse" role="tab" aria-selected="true">Browse</button>
      <button id="tab-health" role="tab" aria-selected="false">Health</button>
    </div>
    <label class="control">Theme
      <select id="theme-select" aria-label="Theme">
        <option value="quiet">Quiet</option>
        <option value="vivid">Vivid</option>
        <option value="deck">Deck</option>
      </select>
    </label>
    <label class="control">Appearance
      <select id="appearance-select" aria-label="Appearance">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="system">System</option>
      </select>
    </label>
    <button id="help-btn" aria-label="Help">?</button>
  </header>
  <main>
    <section id="browse-view">
      <aside id="folder-rail" aria-label="Folders"></aside>
      <section id="contents" aria-label="Bookmarks"></section>
    </section>
    <section id="health-view" hidden>
      <div class="health-toolbar">
        <label class="control">Analyze
          <select id="health-scope" aria-label="Scope to analyze"></select>
        </label>
      </div>
      <div id="health-container"></div>
    </section>
  </main>
  <script type="module" src="manager.js"></script>
</body>
</html>
